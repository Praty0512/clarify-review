[project]
name = "clarifyreview"
version = "0.1.0"
description = "A pull request reviewer that detects ambiguous intent and asks before it critiques."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",   # default provider
    "anthropic>=1.0",     # alternative provider, kept working
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
# Heavier, only needed for specific stages.
bench = ["datasets>=2.19"]              # SWE-bench Verified loading
embed = ["sentence-transformers>=2.7"]  # better embeddings for detector (a)
polyglot = ["tree-sitter>=0.22", "tree-sitter-python>=0.21"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
clarifyreview = "clarifyreview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
