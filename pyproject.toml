[project]
name = "clarifyreview"
version = "0.1.0"
description = "A pull request reviewer that detects ambiguous intent and asks before it critiques."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",   # default provider
    "anthropic>=1.0",     # alternative provider, kept working
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
# Heavier, only needed for specific stages.
bench = ["datasets>=2.19"]              # SWE-bench Verified loading
embed = ["sentence-transformers>=2.7"]  # better embeddings for detector (a)
# Symbol extraction for JavaScript, TypeScript/TSX, Java, C, C++, Rust and Go. Tested:
# tree-sitter 0.25.2, python 0.25.0, javascript 0.25.0, typescript 0.23.2,
# java 0.23.5, rust 0.24.2, c 0.24.2, cpp 0.23.4, go 0.23.4 (Windows, Python 3.13).
polyglot = [
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
    "tree-sitter-java>=0.23,<1",
    "tree-sitter-rust>=0.23,<1",
    "tree-sitter-c>=0.23,<1",
    "tree-sitter-cpp>=0.23,<1",
    "tree-sitter-go>=0.23,<1",
]
app = ["pyjwt[crypto]>=2.8"]            # GitHub App authentication for the live bot
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
docs = ["matplotlib>=3.8", "python-docx>=1.1", "python-pptx>=0.6.23", "pymupdf>=1.24", "pywin32>=306; sys_platform == 'win32'"]  # report, deck and figures

[project.scripts]
clarifyreview = "clarifyreview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
